name: build

# Builds the standalone LTB app on every push to main (after PR
# merge). Artifacts are attached to the workflow run and downloadable
# for 30 days. For a proper release, push a ``v*`` tag and this same
# workflow creates a GitHub Release with the binaries attached.
#
# Runs in parallel on three OS runners:
#   macOS (arm64)   → LTB.app + .dmg   (Apple Silicon)
#   Windows x64     → LTB.exe bundle    (.zip)
#   Linux   x64     → LTB directory     (.tar.gz)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:   # manual trigger from the Actions tab

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write     # required to publish GitHub Releases on tag pushes

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14        # Apple Silicon runner
            artifact: LTB-macos-arm64
            archive: zip
          - name: windows-x64
            runner: windows-latest
            artifact: LTB-windows-x64
            archive: zip
          - name: linux-x64
            runner: ubuntu-latest
            artifact: LTB-linux-x64
            archive: tar

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux-only build + Qt runtime libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Qt platform libraries (so the offscreen test runner and
          # the packaged bundle both work)
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            binutils patchelf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build app
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_app.py --clean

      - name: Verify build output
        shell: bash
        run: |
          echo "--- dist/ ---"
          ls -la dist/ || true
          echo "--- dist/LTB/ (if present) ---"
          ls -la dist/LTB/ 2>/dev/null | head -20 || true

      - name: Package macOS .app into .zip
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          zip -r LTB-macos-arm64.zip LTB.app

      - name: Package Windows bundle into .zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ github.workspace }}\dist\LTB" `
            -DestinationPath "${{ github.workspace }}\dist\LTB-windows-x64.zip"

      - name: Package Linux bundle into .tar.gz
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dist
          tar -czf LTB-linux-x64.tar.gz LTB

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/LTB-*.zip
            dist/LTB-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    # Only runs when a v* tag is pushed. Collects the three OS
    # artifacts and publishes them on a GitHub Release.
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            artifacts/**/LTB-*.zip
            artifacts/**/LTB-*.tar.gz
